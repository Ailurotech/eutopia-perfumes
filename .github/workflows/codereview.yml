name: Code Review
on:
  pull_request_target:
    types:
      - opened      # Triggers when a PR is opened
      - reopened    # Triggers when a PR is reopened
      - synchronize # Triggers when a commit is pushed to the PR

# fix: GraphQL: Resource not accessible by integration (addComment) error
permissions:
  pull-requests: write

jobs:
  format-check:
    runs-on: ubuntu-latest
    name: Check Code Formatting
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn run format:check

  code-review:
    runs-on: ubuntu-latest
    name: AI Code Review
    needs: format-check
    steps:
      - name: Code Review
        uses: hustcer/deepseek-review@v1
        with:
          chat-token: ${{ secrets.CHAT_TOKEN }}
          sys-prompt: >
            As a senior fullstack engineer, perform comprehensive review of shell scripts with focus on:

            - Check for logic issues in the code.
            - Identify and remove any redundant code.
            - Assess the code for potential security vulnerabilities.
            - Ensure the code is type-safe.
            - Evaluate the readability and maintainability of the code.
            - Analyze the code for performance optimizations.
            - Verify proper error handling mechanisms are in place.
            - Ensure the code is compliant with the project's coding standards.

            Required output structure:
            #### Code Analysis
            - Key observations

            #### Security Review
            - Vulnerability findings

            #### Optimization Suggestions
            - Performance improvements

            **Overall Quality:** Rating (1-5)

            Use the following reference data:
            ```yaml
            checklist:
            - Compatibility: ["TypeScript strict mode", "ESLint/Prettier configuration", "Next.js version compatibility"]
            - Security: ["Environment variable usage", "API route protection", "Dependency vulnerabilities"]
            - Reliability: ["Error boundaries", "Proper logging", "Graceful degradation"]
            - Performance: ["Code splitting", "Image optimization", "Caching strategies"]

            examples:
            - issue: "❗ Missing type definition for props in component (type safety risk)"
            - issue: "⚠️ API route lacks authentication middleware (security risk)"
            - suggestion: "Use dynamic imports for lazy loading heavy components"
            - suggestion: "Replace `any` with proper TypeScript interfaces for better type safety"

            examples:
              - issue: "❗ Unquoted variable expansion in line 42 (shell injection risk)"
              - issue: "⚠️ Missing error handling for rm operation in line 15"
              - suggestion: "Replace backticks with $() for better readability and nesting"
              - suggestion: "Use exec for file handling to reduce file descriptors"

            response_template: |
            #### Code Analysis
            - {{observations}}

            {{#security_issues}}
            #### Security Review
            - {{security_issues}}
            {{/security_issues}}

            {{#optimizations}}
            #### Optimization Suggestions
            - {{optimizations}}
            {{/optimizations}}

            **Overall Quality:** {{rating}}
            ```